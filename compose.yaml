services:
  munch-maze:
    image: ghcr.io/ctrlaltspoods/munch-maze:latest
    # build: .          # uncomment to build from this folder instead
    container_name: munch-maze
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      SERVER_NAME: "Munch Maze"
      MAX_PLAYERS_PER_MAZE: "0"   # 0 = unlimited
      MAX_MAZES: "200"
      SHOW_LOBBY: "true"
      DEFAULT_SEED: ""
      TICK_RATE: "30"
      MAX_CONNECTIONS: "1000"       # 0 = no limit
      MAX_CONNECTIONS_PER_IP: "20"  # 0 = no limit
      ALLOWED_ORIGINS: ""           # other sites allowed to connect, comma-separated
      TRUST_PROXY: "false"          # true when behind a reverse proxy
      TEST_MODE: "false"            # true gives hosts a menu to fire any power-up
      PUID: "1000"
      PGID: "1000"
    restart: unless-stopped
