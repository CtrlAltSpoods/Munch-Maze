services:
  munch-maze:
    image: ghcr.io/ctrlaltspoods/munch-maze:latest
    # build: .          # uncomment to build from this folder instead
    container_name: munch-maze
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      SERVER_NAME: "Munch Maze"
      MAX_PLAYERS_PER_MAZE: "0"   # 0 = unlimited
      MAX_MAZES: "200"
      SHOW_LOBBY: "true"
      DEFAULT_SEED: ""
      TICK_RATE: "30"
      MAX_CONNECTIONS: "1000"       # 0 = no limit
      MAX_CONNECTIONS_PER_IP: "20"  # 0 = no limit
      ALLOWED_ORIGINS: ""           # other sites allowed to connect, comma-separated
      TRUST_PROXY: "false"          # true when behind a reverse proxy
      TEST_MODE: "false"            # true gives hosts a menu to fire any power-up
      # Discord login (optional): see README "Discord accounts"
      PUBLIC_URL: ""                # e.g. http://10.0.10.160:8080
      DISCORD_CLIENT_ID: ""
      DISCORD_CLIENT_SECRET: ""
      ADMIN_DISCORD_IDS: ""        # your Discord user id(s), for /admin.html
      DISCORD_WEBHOOK_URL: ""      # optional: announce new #1 scores and level 20+ clears
      TZ: "Australia/Adelaide"      # weekly/daily leaderboards follow this
      PUID: "1000"
      PGID: "1000"
    restart: unless-stopped
